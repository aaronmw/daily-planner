[package]
name = "daily-planner"
version = "1.0.0"
description = "A local-first daily planning app"
authors = ["Aaron Wright"]
edition = "2021"

[lib]
name = "daily_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

[profile.dev]
# Native debugging is not part of the normal UI workflow. Omitting debug
# symbols keeps Tauri's development artifacts substantially smaller.
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
